<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك أسئلة العاقل</title>
    <link rel="stylesheet" href="style.css">
    <!-- خط عربي فاخر (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- خلفية النجوم الذهبية المتحركة (سلوموشن) -->
    <canvas id="starsCanvas"></canvas>

    <!-- الهيدر وروابط التليقرام -->
    <header class="site-header">
        <div class="header-content">
            <div class="logo-area">
                <i class="fa-solid fa-book-bookmark glowing-icon"></i>
                <h1>بنك أسئلة العاقل</h1>
            </div>
            <div class="telegram-links">
                <a href="https://t.me/Al_3agle" target="_blank" class="tg-btn group-btn">
                    <i class="fab fa-telegram-plane"></i> قروب التليقرام العام
                </a>
                <a href="https://t.me/Al3agl_bot" target="_blank" class="tg-btn store-btn">
                    <i class="fa-solid fa-store"></i> متجر العاقل
                </a>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-container">
        
        <!-- قسم البحث والتصفية -->
        <section class="search-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن نص السؤال أو برقم السؤال (مثال: 15 أو التوحيد)...">
            </div>
            
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all">الكل</button>
                <button class="filter-btn" data-filter="islamic">قسم الدين (511)</button>
                <button class="filter-btn" data-filter="history">قسم التاريخ والمناصب (140)</button>
                <button class="filter-btn" data-filter="geography">قسم الجغرافيا والثقافة (150)</button>
            </div>
        </section>

        <!-- عداد النتائج -->
        <div class="results-info">
            <span>الأسئلة المعروضة: <strong id="questionCount">0</strong> سؤال</span>
        </div>

        <!-- حاوية الأسئلة (تتغير بانسيابية وبدون تقطيع) -->
        <section class="questions-container" id="questionsContainer">
            <!-- سيتم تعبئة الأسئلة ديناميكياً عبر الجافاسكريبت -->
        </section>

    </main>

    <!-- الفوتر -->
    <footer class="site-footer">
        <p>جميع الحقوق محفوظة &copy; 2026 - بنك أسئلة العاقل</p>
    </footer>

    <!-- ملف البيانات والجافاسكريبت -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
